<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 32 32">
  <!-- Program icon: a desktop calculator lying on its side, in the teal of the
       classic Windows 3.1 program icons. Drawn on a 32-unit grid at whole
       coordinates throughout, so at 32 px (and any multiple of it) every edge
       lands on a pixel boundary. The case fills the box edge to edge and is
       made of few, large parts, so it still reads at title-bar sizes.

       The case is built in layers, each one painted over the last: a black
       silhouette with its corners notched off, a cyan rim lit from the top
       left, a navy shadow along the bottom right, and the teal face inside. -->
  <defs>
    <!-- One key: a black cap with a silver face, lit white along its top and
         left edges, so the black reads as the shadow it casts. -->
    <g id="key">
      <rect width="4" height="3" fill="#000000"/>
      <rect width="3" height="2" fill="#ffffff"/>
      <rect x="1" y="1" width="2" height="1" fill="#c0c0c0"/>
    </g>
  </defs>

  <!-- Case. -->
  <path d="M2 3 H30 V4 H31 V28 H30 V29 H2 V28 H1 V4 H2 Z" fill="#000000"/>
  <rect x="2" y="4" width="28" height="24" fill="#00ffff"/>
  <rect x="3" y="5" width="27" height="23" fill="#000080"/>
  <rect x="3" y="5" width="26" height="22" fill="#008080"/>

  <!-- Display: a window sunk into the case — black along its top and left
       edges, the case's cyan along the bottom and right — showing a silver
       and white readout. -->
  <rect x="4" y="7" width="17" height="6" fill="#00ffff"/>
  <rect x="4" y="7" width="16" height="5" fill="#000000"/>
  <rect x="5" y="8" width="15" height="2" fill="#c0c0c0"/>
  <rect x="5" y="10" width="15" height="2" fill="#ffffff"/>

  <!-- Keypad: three rows of five keys. -->
  <use xlink:href="#key" x="4" y="14"/>
  <use xlink:href="#key" x="9" y="14"/>
  <use xlink:href="#key" x="14" y="14"/>
  <use xlink:href="#key" x="19" y="14"/>
  <use xlink:href="#key" x="24" y="14"/>

  <use xlink:href="#key" x="4" y="18"/>
  <use xlink:href="#key" x="9" y="18"/>
  <use xlink:href="#key" x="14" y="18"/>
  <use xlink:href="#key" x="19" y="18"/>
  <use xlink:href="#key" x="24" y="18"/>

  <use xlink:href="#key" x="4" y="22"/>
  <use xlink:href="#key" x="9" y="22"/>
  <use xlink:href="#key" x="14" y="22"/>
  <!-- The last two keys of the bottom row make one wide "=" key. -->
  <rect x="19" y="22" width="9" height="3" fill="#000000"/>
  <rect x="19" y="22" width="8" height="2" fill="#ffffff"/>
  <rect x="20" y="23" width="7" height="1" fill="#c0c0c0"/>
</svg>
